<!DOCTYPE html>
<html lang="en">
<head>
    <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" 
    crossorigin="anonymous"/>
    <link rel="stylesheet" href="styles.css" />
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=7">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    <div class="calculator-container">
        <div class="calculator">
            <input type="text" disabled id="number-input">
            <input placeholder="ANS" type="text" disabled id="result">
            <div class="buttons">
                <div class="row">
                    <div onclick="handleClickButton(this)" class="col col-3 col-sm-3 cal-buttons">+</div>
                    <div 
                    <div onclick="handleClickButton(this)"
                    class="col col-3 cal-buttons">-</div>
                    <div 
                    <div onclick="handleClickButton(this)"
                    class="col col-3 cal-buttons">*</div>
                    <div 
                    <div onclick="handleClickButton(this)"
                    class="col col-3 cal-buttons">/</div>
                </div>
                <div class="row">
                    <div 
                    <div onclick="handleClickButton(this)"
                    class="col col-3 cal-buttons">7</div>
                    <div 
                    <div onclick="handleClickButton(this)"
                    class="col col-3 cal-buttons">8</div>
                    <div 
                    <div onclick="handleClickButton(this)"
                    class="col col-3 cal-buttons">9</div>
                </div>
                <div class="row">
                    <div 
                    <div onclick="handleClickButton(this)"
                    class="col col-3 cal-buttons">4</div>
                    <div 
                    <div onclick="handleClickButton(this)"
                    class="col col-3 cal-buttons">5</div>
                    <div 
                    <div onclick="handleClickButton(this)"
                    class="col col-3 cal-buttons">6</div>
                </div>
                <div class="row">
                    <div 
                    <div onclick="handleClickButton(this)"
                    class="col col-3 cal-buttons">1</div>
                    <div 
                    <div onclick="handleClickButton(this)"
                    class="col col-3 cal-buttons">2</div>
                    <div 
                    <div onclick="handleClickButton(this)"
                    class="col col-3 cal-buttons">3</div>
                </div>
                <div class="row">
                    <div 
                    <div onclick="handleClickButton(this)"
                    class="col col-4 cal-buttons">0</div>
                    <div onclick="reset()" class="col col-8 col-3 cal-buttons">Clear</div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
   <script type="module" 
   src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"
   ></script> 
</body>
</html>
